name: RAM sports review (no deployment)
on:
  push:
    branches: [review/ram-sports-live-03]
    paths-ignore: ['.delivery/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ram-sports-review
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
